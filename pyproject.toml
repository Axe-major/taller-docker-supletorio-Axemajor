[project]
name = "reservas"
version = "1.0.0"
description = "API de reservas de salas de estudio de la biblioteca con FastAPI y SQLModel"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pymysql==1.2.3",
    "sqlmodel==0.0.42",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
